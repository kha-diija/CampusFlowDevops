server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Relais de l'API vers le conteneur backend (réseau docker compose)
    location /api/ {
        proxy_pass http://api:8080;

        # $http_host garde le port (localhost:3000) => Spring voit une requête same-origin
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le navigateur parle à nginx en same-origin : on retire Origin
        # pour que Spring ne fasse aucun contrôle CORS
        proxy_set_header Origin "";
    }

    # Application React/Vite (routage côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }

  }
}

